name: Windows launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone executable
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NRBlox-Windows-x64
          path: release/NRBlox.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "NRBlox-Communitys-$env:GITHUB_REF_NAME-win-x64.exe"
          Copy-Item release/NRBlox.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content SHA256SUMS.txt -Encoding ascii
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "NRBlox Community $env:GITHUB_REF_NAME" --notes "Launcher Windows nativo. Consulte a wiki e os avisos de compatibilidade no README." }
          gh release upload $env:GITHUB_REF_NAME $asset SHA256SUMS.txt --clobber
